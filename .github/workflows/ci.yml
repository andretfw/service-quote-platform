name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Build formatting patch
        if: steps.format.outcome == 'failure'
        run: |
          npm exec -- prettier --write .
          git diff -- . ':(exclude)package-lock.json' > prettier.patch

      - name: Upload formatting patch
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        id: test
        continue-on-error: true
        run: npm test

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce quality gate
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'format=%s\nlint=%s\ntypecheck=%s\ntest=%s\naudit=%s\nbuild=%s\n' \
            "$FORMAT" "$LINT" "$TYPECHECK" "$TEST" "$AUDIT" "$BUILD"
          test "$FORMAT" = success
          test "$LINT" = success
          test "$TYPECHECK" = success
          test "$TEST" = success
          test "$AUDIT" = success
          test "$BUILD" = success
